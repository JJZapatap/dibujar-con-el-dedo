<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dibujar con el dedo - MediaPipe</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    h1 {
      margin: 12px 0 8px;
      font-size: 1.5rem;
      font-weight: 600;
    }
    .controles {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    button.rojo { background: #ef4444; }
    button.rojo:hover { background: #dc2626; }
    button.verde { background: #22c55e; }
    button.verde:hover { background: #16a34a; }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }
    input[type="color"] {
      width: 36px;
      height: 32px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }
    input[type="range"] {
      width: 100px;
    }
    #contenedor {
      position: relative;
      width: 640px;
      max-width: 95vw;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #canvasDibujo {
      z-index: 2;
      pointer-events: none;
    }
    #canvasLandmarks {
      z-index: 3;
      pointer-events: none;
    }
    video {
      z-index: 1;
      transform: scaleX(-1);
    }
    .info {
      margin-top: 16px;
      font-size: 14px;
      opacity: 0.75;
      text-align: center;
      max-width: 520px;
      line-height: 1.5;
    }
    .estado {
      margin-top: 8px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h1>✏️ Dibujar con el dedo</h1>

  <div class="controles">
    <button id="btnIniciar">Iniciar cámara</button>
    <button id="btnLimpiar" class="rojo">Borrar</button>
    <button id="btnGuardar" class="verde">Guardar imagen</button>
    <label>
      Color
      <input type="color" id="colorPicker" value="#00ff88" />
    </label>
    <label>
      Grosor
      <input type="range" id="grosor" min="2" max="24" value="6" />
    </label>
  </div>

  <div id="contenedor">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvasDibujo"></canvas>
    <canvas id="canvasLandmarks"></canvas>
  </div>

  <p class="info">
    Extiende el <strong>dedo índice</strong>. El trazo sigue la punta del dedo.<br>
    Si no ves nada, permite el acceso a la cámara cuando el navegador lo pida.
  </p>
  <p class="estado" id="estado">Listo para iniciar</p>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvasDibujo = document.getElementById("canvasDibujo");
    const canvasLandmarks = document.getElementById("canvasLandmarks");
    const ctxDibujo = canvasDibujo.getContext("2d");
    const ctxLandmarks = canvasLandmarks.getContext("2d");
    const estado = document.getElementById("estado");
    const btnIniciar = document.getElementById("btnIniciar");

    let handLandmarker = null;
    let lastVideoTime = -1;
    let lastX = null;
    let lastY = null;
    let color = "#00ff88";
    let grosor = 6;
    let corriendo = false;

    document.getElementById("colorPicker").addEventListener("input", e => {
      color = e.target.value;
    });
    document.getElementById("grosor").addEventListener("input", e => {
      grosor = parseInt(e.target.value, 10);
    });
    document.getElementById("btnLimpiar").addEventListener("click", () => {
      ctxDibujo.clearRect(0, 0, canvasDibujo.width, canvasDibujo.height);
      lastX = lastY = null;
    });
    document.getElementById("btnGuardar").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = "dibujo-dedo.png";
      link.href = canvasDibujo.toDataURL("image/png");
      link.click();
    });

    async function crearHandLandmarker() {
      estado.textContent = "Cargando modelo de MediaPipe...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 1
      });
      estado.textContent = "Modelo listo";
    }

    btnIniciar.addEventListener("click", async () => {
      if (corriendo) return;
      btnIniciar.disabled = true;
      try {
        estado.textContent = "Solicitando cámara...";
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        const w = video.videoWidth || 640;
        const h = video.videoHeight || 480;
        canvasDibujo.width = canvasLandmarks.width = w;
        canvasDibujo.height = canvasLandmarks.height = h;

        if (!handLandmarker) await crearHandLandmarker();

        corriendo = true;
        estado.textContent = "Dibujando — mueve el dedo índice";
        btnIniciar.textContent = "Cámara activa";
        requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        estado.textContent = "Error: " + (err.message || "no se pudo acceder a la cámara");
        btnIniciar.disabled = false;
      }
    });

    function loop() {
      if (!corriendo) return;

      if (video.readyState >= 2 && handLandmarker) {
        if (video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          const results = handLandmarker.detectForVideo(video, performance.now());

          ctxLandmarks.clearRect(0, 0, canvasLandmarks.width, canvasLandmarks.height);

          if (results.landmarks && results.landmarks.length > 0) {
            const landmarks = results.landmarks[0];
            dibujarLandmarks(landmarks);

            const tip = landmarks[8]; // punta del índice
            const x = tip.x * canvasDibujo.width;
            const y = tip.y * canvasDibujo.height;
            const xEspejo = canvasDibujo.width - x;

            if (lastX !== null && lastY !== null) {
              ctxDibujo.beginPath();
              ctxDibujo.moveTo(lastX, lastY);
              ctxDibujo.lineTo(xEspejo, y);
              ctxDibujo.strokeStyle = color;
              ctxDibujo.lineWidth = grosor;
              ctxDibujo.lineCap = "round";
              ctxDibujo.lineJoin = "round";
              ctxDibujo.stroke();
            }
            lastX = xEspejo;
            lastY = y;
          } else {
            lastX = lastY = null;
          }
        }
      }
      requestAnimationFrame(loop);
    }

    function dibujarLandmarks(landmarks) {
      const conexiones = [
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],
        [0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20],
        [5,9],[9,13],[13,17]
      ];

      ctxLandmarks.strokeStyle = "rgba(0,255,255,0.55)";
      ctxLandmarks.lineWidth = 2;

      for (const [i, j] of conexiones) {
        const a = landmarks[i];
        const b = landmarks[j];
        ctxLandmarks.beginPath();
        ctxLandmarks.moveTo(canvasLandmarks.width - a.x * canvasLandmarks.width, a.y * canvasLandmarks.height);
        ctxLandmarks.lineTo(canvasLandmarks.width - b.x * canvasLandmarks.width, b.y * canvasLandmarks.height);
        ctxLandmarks.stroke();
      }

      // Resaltar punta del índice
      const tip = landmarks[8];
      ctxLandmarks.beginPath();
      ctxLandmarks.arc(
        canvasLandmarks.width - tip.x * canvasLandmarks.width,
        tip.y * canvasLandmarks.height,
        9, 0, Math.PI * 2
      );
      ctxLandmarks.fillStyle = "#facc15";
      ctxLandmarks.fill();
    }
  </script>
</body>
</html>
